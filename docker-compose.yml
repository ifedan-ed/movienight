# Movie Night: the Go server (api and worker, one image), Postgres,
# Meilisearch and Valkey. Settings come from .env (docs/configuration.md).
#
#   docker compose up -d --build
#
# migrate runs once before api and worker on every start and brings the
# schema up to date. A database left by the Python version at Alembic 0016
# is taken over in place. api serves on 127.0.0.1:8137; worker runs the
# scheduled jobs and the queued work. Valkey holds caches, sign-in limits
# and the work queues, with no persistence (sessions are in Postgres).
# api and worker run as uid 1000 and see the movienight-data volume
# read-only at /data, for a file such as SMTP2GO_API_KEY_FILE.

# The project name pins the volumes and the network to the existing ones
# (movienight_movienight-pg, movienight_default, ...) whatever folder this
# file is run from.
name: movienight

x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

# One image for migrate, api and worker; each picks its command.
x-server: &server
  build:
    context: .
    dockerfile: server/Dockerfile
  image: movienight-server:latest
  env_file:
    - .env
  environment:
    # The Go server takes the plain postgresql:// form (the Python's
    # postgresql+psycopg:// is refused with a message).
    DATABASE_URL: postgresql://movienight:${POSTGRES_PASSWORD}@postgres:5432/movienight
    VALKEY_URL: redis://valkey:6379/0
  logging: *logging

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    # A cache and short-lived queues: no snapshots, no append-only file. The
    # memory cap evicts only keys with a lifetime (the caches); the queues
    # and the Seerr status map have none, so they are never evicted.
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    networks:
      - default
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *server
    entrypoint: ["/usr/local/bin/migrate"]
    restart: "no"
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - movienight-data:/data:ro
    ports:
      - "127.0.0.1:8137:8000"
    # Requests in flight get up to 25 s to finish after SIGTERM.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # default: Postgres, Valkey, Meilisearch; ai: LiteLLM (search's best guess).
    networks:
      - default
      - ai
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_started

  worker:
    <<: *server
    entrypoint: ["/usr/local/bin/worker"]
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - movienight-data:/data:ro
    # A job under way gets time to stop at its next check.
    stop_grace_period: 60s
    # ai: LiteLLM ("Picked for you", the digests' wording).
    networks:
      - default
      - ai
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    logging: *logging
    environment:
      POSTGRES_DB: movienight
      POSTGRES_USER: movienight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - movienight-pg:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movienight -d movienight"]
      interval: 5s
      timeout: 5s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    logging: *logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-v154:/meili_data
    networks:
      - default

volumes:
  movienight-data:
  movienight-pg:
  meilisearch-v154:

networks:
  default:
  ai:
    external: true
    name: ${AI_NETWORK_NAME:-movienight-ai}
