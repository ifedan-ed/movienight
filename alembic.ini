# Alembic owns the database schema. The app runs `upgrade head` at start
# (app/core/db.py); to add a change: edit app/models.py, then
#   alembic revision --autogenerate -m "what changed"
# review the generated file, and commit it.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url comes from DATABASE_URL (app/core/config.py), not from here.
# To undo the newest migration on the server: docker compose exec web alembic downgrade -1

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
