<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Movie Night</title>
</head>
<body>
    <div id="MovieNightConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="MovieNightConfigForm">
                    <div class="inputContainer">
                        <input is="emby-input" type="url" id="MovieNightUrl" label="Movie Night address" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="password" id="MovieNightToken" label="Token" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="MovieNightProgressSeconds" min="10" max="600" label="Send progress every (seconds)" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="MovieNightQueueSize" min="1" label="Events kept while Movie Night doesn't answer" />
                        <div class="fieldDescription">At least 1. When full, the oldest goes and Jellyfin's log says so; plays still reach Movie Night by its own sync. Takes effect when Jellyfin restarts.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var MovieNightConfig = { pluginId: "5bf59830-f994-4e33-8e31-0b4570f490b2" };

            document.querySelector("#MovieNightConfigPage").addEventListener("pageshow", function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(MovieNightConfig.pluginId).then(function (config) {
                    document.querySelector("#MovieNightUrl").value = config.MovieNightUrl || "";
                    document.querySelector("#MovieNightToken").value = config.Token || "";
                    document.querySelector("#MovieNightProgressSeconds").value = config.ProgressSeconds || 30;
                    document.querySelector("#MovieNightQueueSize").value = config.QueueSize || 1000;
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector("#MovieNightConfigForm").addEventListener("submit", function (e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(MovieNightConfig.pluginId).then(function (config) {
                    config.MovieNightUrl = document.querySelector("#MovieNightUrl").value.trim();
                    config.Token = document.querySelector("#MovieNightToken").value.trim();
                    config.ProgressSeconds = parseInt(document.querySelector("#MovieNightProgressSeconds").value, 10) || 30;
                    var queue = parseInt(document.querySelector("#MovieNightQueueSize").value, 10);
                    var raised = !isNaN(queue) && queue < 1;
                    // A queue keeps at least one event: say so when a lower number is raised to it.
                    config.QueueSize = isNaN(queue) ? 1000 : Math.max(1, queue);
                    ApiClient.updatePluginConfiguration(MovieNightConfig.pluginId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                        if (raised) {
                            document.querySelector("#MovieNightQueueSize").value = 1;
                            Dashboard.alert("Events kept while Movie Night doesn't answer: at least 1, so it was saved as 1.");
                        }
                    });
                });
                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
