<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Movie Night fits together</title>
  <desc id="d">Browsers, the iPhone and Android app, Kodi and the Jellyfin plugin reach Movie Night through your reverse proxy. Movie Night keeps everyone's data in Postgres, searches with Meilisearch, and talks to TMDB and, optionally, Jellyfin, Seerr, MDBList, an AI endpoint and SMTP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11141b"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd17a"/><stop offset="1" stop-color="#f5b73b"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6577"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)"/>

  <!-- Clients -->
  <text x="480" y="44" text-anchor="middle" fill="#8b93a7" font-size="13" font-weight="700" letter-spacing="2">YOUR PEOPLE'S DEVICES</text>
  <g font-size="14" font-weight="650" fill="#e9ecf2" text-anchor="middle">
    <g transform="translate(70,62)"><rect width="150" height="52" rx="14" fill="#1a1e28" stroke="#2c3242"/><text x="75" y="24">Browser</text><text x="75" y="41" font-size="11.5" font-weight="500" fill="#8b93a7">website · installable</text></g>
    <g transform="translate(240,62)"><rect width="150" height="52" rx="14" fill="#1a1e28" stroke="#2c3242"/><text x="75" y="24">iPhone · iPad</text><text x="75" y="41" font-size="11.5" font-weight="500" fill="#8b93a7">Expo app</text></g>
    <g transform="translate(410,62)"><rect width="150" height="52" rx="14" fill="#1a1e28" stroke="#2c3242"/><text x="75" y="24">Android</text><text x="75" y="41" font-size="11.5" font-weight="500" fill="#8b93a7">Expo app</text></g>
    <g transform="translate(580,62)"><rect width="150" height="52" rx="14" fill="#1a1e28" stroke="#2c3242"/><text x="75" y="24">Kodi</text><text x="75" y="41" font-size="11.5" font-weight="500" fill="#8b93a7">add-on</text></g>
    <g transform="translate(750,62)"><rect width="150" height="52" rx="14" fill="#1a1e28" stroke="#2c3242"/><text x="75" y="24">Jellyfin</text><text x="75" y="41" font-size="11.5" font-weight="500" fill="#8b93a7">plugin · webhook</text></g>
  </g>
  <g stroke="#8b93a7" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M145,114 C145,140 400,140 470,160"/>
    <path d="M315,114 C315,138 430,146 474,160"/>
    <path d="M485,114 L480,158"/>
    <path d="M655,114 C655,138 530,146 486,160"/>
    <path d="M825,114 C825,140 560,140 490,160"/>
  </g>

  <!-- Proxy -->
  <g transform="translate(330,162)">
    <rect width="300" height="46" rx="23" fill="#151923" stroke="#3a4152" stroke-dasharray="5 4"/>
    <text x="150" y="20" text-anchor="middle" fill="#e9ecf2" font-size="14" font-weight="700">Your reverse proxy</text>
    <text x="150" y="36" text-anchor="middle" fill="#8b93a7" font-size="11.5">Caddy · nginx · Traefik — TLS</text>
  </g>
  <path d="M480,208 L480,240" stroke="#8b93a7" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Core -->
  <g transform="translate(300,244)" filter="url(#sh)">
    <rect width="360" height="104" rx="22" fill="url(#core)"/>
    <text x="180" y="44" text-anchor="middle" fill="#1a1300" font-size="26" font-weight="800">Movie Night</text>
    <text x="180" y="68" text-anchor="middle" fill="#3d2c00" font-size="13" font-weight="600">FastAPI · one Docker Compose stack · 127.0.0.1:8137</text>
    <text x="180" y="88" text-anchor="middle" fill="#3d2c00" font-size="12">sign-in: password · OIDC · both</text>
  </g>

  <!-- Inside the stack -->
  <text x="190" y="392" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="700" letter-spacing="2">IN THE STACK</text>
  <g font-size="14" font-weight="700" fill="#e9ecf2">
    <g transform="translate(70,404)"><rect width="240" height="58" rx="14" fill="#1a1e28" stroke="#f5b73b" stroke-opacity=".55"/><text x="18" y="26">Postgres</text><text x="18" y="44" font-size="12" font-weight="500" fill="#a9b0c0">everyone's history, ratings, lists</text></g>
    <g transform="translate(70,474)"><rect width="240" height="58" rx="14" fill="#1a1e28" stroke="#f5b73b" stroke-opacity=".55"/><text x="18" y="26">Meilisearch</text><text x="18" y="44" font-size="12" font-weight="500" fill="#a9b0c0">library and catalog search</text></g>
  </g>
  <g stroke="#8b93a7" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M360,348 C360,380 330,410 312,428"/>
    <path d="M340,348 C320,420 330,480 312,500"/>
  </g>

  <!-- Outside services -->
  <text x="680" y="392" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="700" letter-spacing="2">OUTSIDE SERVICES</text>
  <g font-size="13" font-weight="700" fill="#e9ecf2">
    <g transform="translate(470,404)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">TMDB</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="600" fill="#f5b73b">required</text></g>
    <g transform="translate(690,404)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">Jellyfin</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="500" fill="#8b93a7">optional</text></g>
    <g transform="translate(470,458)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">Seerr</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="500" fill="#8b93a7">requests</text></g>
    <g transform="translate(690,458)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">MDBList</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="500" fill="#8b93a7">lists · scores</text></g>
    <g transform="translate(470,512)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">AI endpoint</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="500" fill="#8b93a7">any OpenAI API</text></g>
    <g transform="translate(690,512)"><rect width="200" height="44" rx="12" fill="#1a1e28" stroke="#2c3242"/><text x="16" y="27">SMTP</text><text x="184" y="27" text-anchor="end" font-size="11" font-weight="500" fill="#8b93a7">digest emails</text></g>
  </g>
  <path d="M590,348 C580,370 566,384 560,398" stroke="#5d6577" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#ao)"/>

  <text x="480" y="584" text-anchor="middle" fill="#5d6577" font-size="11.5">Movie Night hosts no films: it keeps what people enter and reads play state from your own Jellyfin.</text>
</svg>
